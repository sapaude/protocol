syntax = "proto3";

package go_sapaude_dogai;
option go_package = "github.com/sapaude/protocol/ai/go_sapaude_dogai";

// ModelCapability 模型能力定义
message ModelCapability {
  bool chat = 1;          // 支持聊天/对话
  bool completion = 2;    // 支持文本补全
  bool vision = 3;        // 支持图像输入
  bool function_call = 4; // 支持函数/工具调用
  bool embedding = 5;     // 支持嵌入
  bool streaming = 6;     // 支持流式输出
}

// ModelMetadata 模型元数据
message ModelMetadata {
  int32 context_window = 1;    // Token上下文窗口大小
  int32 max_output_tokens = 2; // 最大输出token数
  string version = 3;           // 模型版本
  string family = 4;            // 模型家族
  bool supports_vision = 5;     // 是否支持视觉
  bool supports_tools = 6;      // 是否支持工具
}

// ProviderModel Provider支持的模型
message ProviderModel {
  uint32 id = 1;                       // 主键ID
  string provider_id = 2;              // Provider唯一标识
  string model_id = 3;                 // 模型ID
  string model_name = 4;               // 模型名称
  string model_type = 5;               // 模型类型(chat/embedding/vision)
  string release_time = 6;             // 模型发布时间
  string model_desc = 7;               // 模型描述
  ModelCapability capabilities = 8;    // 模型能力
  ModelMetadata metadata = 9;          // 模型元数据
  bool is_active = 10;                 // 模型是否可用
  bool is_deprecated = 11;             // 模型是否已废弃
  string created_at = 12;              // 创建时间
  string updated_at = 13;              // 更新时间
}

// Provider AI提供商配置
message Provider {
  uint32 id = 1;                        // 主键ID
  string provider_id = 2;               // Provider唯一标识
  string provider_name = 3;             // Provider名称
  string api_endpoint = 4;              // API端点地址
  string api_key = 5;                   // API密钥
  repeated ProviderModel models = 6;    // 可用模型列表
  bool is_available = 7;                // API是否可用
  bool is_disabled = 8;                 // 是否已禁用
  string proxy_url = 9;                 // 代理URL
  string created_at = 10;               // 创建时间
  string updated_at = 11;               // 更新时间
}

// CondProvider 查询Provider的条件
message CondProvider {
  string provider_id = 1; // Provider唯一标识
}

// SaveProviderReq 保存Provider请求
message SaveProviderReq {
  Provider provider = 1;
}

// SaveProviderRsp 保存Provider响应
message SaveProviderRsp {
  // 空响应，通过grpc-gateway中间件统一处理
}

// UpdateProviderReq 更新Provider请求
message UpdateProviderReq {
  string provider_id = 1;  // Provider唯一标识
  Provider provider = 2;   // 更新的Provider信息
}

// UpdateProviderRsp 更新Provider响应
message UpdateProviderRsp {
  // 空响应，通过grpc-gateway中间件统一处理
}

// GetProviderListsReq 查询Provider列表请求
message GetProviderListsReq {
  CondProvider condition = 1; // 查询条件(可选)
}

// GetProviderListsRsp 查询Provider列表响应
message GetProviderListsRsp {
  repeated Provider providers = 1;
}

// GetProviderReq 获取指定Provider请求
message GetProviderReq {
  string provider_id = 1; // Provider唯一标识
}

// GetProviderRsp 获取指定Provider响应
message GetProviderRsp {
  Provider provider = 1;
}

// DeleteProvidersReq 删除Providers请求
message DeleteProvidersReq {
  repeated string provider_ids = 1; // Provider唯一标识列表
}

// DeleteProvidersRsp 删除Providers响应
message DeleteProvidersRsp {
  // 空响应，通过grpc-gateway中间件统一处理
}

// GetProviderSupportModelsReq 获取Provider支持的模型列表请求
message GetProviderSupportModelsReq {
  string provider_id = 1; // Provider唯一标识
}

// GetProviderSupportModelsRsp 获取Provider支持的模型列表响应
message GetProviderSupportModelsRsp {
  repeated ProviderModel models = 1;
}